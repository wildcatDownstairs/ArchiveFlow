[package]
name = "archiveflow-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "archiveflow"

[[bin]]
name = "archiveflow"
path = "src/main.rs"

[dependencies]
archiveflow-core = { path = "../core" }
gpui-kit = "=0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
futures = "0.3"
rfd = "0.15"
open = "5"
tempfile = "3"

[build-dependencies]
winresource = "0.1.31"
