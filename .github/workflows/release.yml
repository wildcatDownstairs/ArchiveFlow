name: Native release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  package:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release -p archiveflow-desktop --locked
      - shell: pwsh
        run: ./scripts/package.ps1 -Platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveFlow-${{ matrix.platform }}
          path: artifacts/*.zip
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*.zip
